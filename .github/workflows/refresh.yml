name: Продление ключей

on:
  schedule:
    - cron: "0 3 * * 1"   # по понедельникам
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Продлить ключи Instagram и Threads
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python refresh_tokens.py
